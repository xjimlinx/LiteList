[package]
name = "litelist"
version = "0.2.0"
edition = "2024"
description = "A small, local-first Windows floating task list"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Diagnostics_Debug",
  "Win32_Storage_FileSystem", "Win32_Security"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
